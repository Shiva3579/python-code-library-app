---
services:

  db:
    image: siva1824/python-microservices:dbimage
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    ports:
      - "3306:3306"
    networks:
      - shiva

  auth_service:
    image: siva1824/python-microservices:authimage
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    ports:
      - "5001:5001"
    networks:
      - shiva
    depends_on:
      - db

  book_service:
    image: siva1824/python-microservices:bookimage
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    ports:
      - "5002:5002"
    networks:
      - shiva
    depends_on:
      - db

  borrow_service:
    image: siva1824/python-microservices:borrowimage
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    ports:
      - "5003:5003"
    networks:
      - shiva
    depends_on:
      - db

  frontend:
    image: siva1824/python-microservices:appimage
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    ports:
      - "5000:5000"
    networks:
      - shiva
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  shiva:
    driver: bridge
